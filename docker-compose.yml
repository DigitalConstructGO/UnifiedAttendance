# Docker Compose for UnifiedAttendance
# Full-stack container orchestration

name: UnifiedAttendance

services:
  # web:
  #   build:
  #     context: ./apps/web
  #     dockerfile: Dockerfile
  #   container_name: UnifiedAttendance-web
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=production
  #   restart: unless-stopped
  #   networks:
  #     - UnifiedAttendance-network

  db:
    image: postgres:16-alpine
    container_name: UnifiedAttendance-postgres
    environment:
      POSTGRES_DB: UnifiedAttendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - UnifiedAttendance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - UnifiedAttendance-network

networks:
  UnifiedAttendance-network:
    driver: bridge

volumes:
  UnifiedAttendance_postgres_data:
